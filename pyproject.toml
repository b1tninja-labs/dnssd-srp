[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback: with no
# build-system table pip injects an unpinned setuptools environment, so a build is
# neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dnssd-srp"
dynamic = ["version"]
# The description names the protocol and the documents, because that is the only text
# a person searching PyPI will read before deciding this is the library they need.
description = "Service Registration Protocol (SRP) requester and registrar checks, DNS Push Notifications, and the DNS Stateful Operations session both depend on"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["dns-sd", "srp", "mdns", "dso", "push-notifications", "rfc9665", "rfc8765", "rfc8490"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Empty unless a module cannot be honest without it. Every entry needs a sentence in
# README.md explaining why the zero-dependency rule was broken for it.
#
# namespy is the one entry: an SRP Update is a DNS Update (RFC 2136) carrying an EDNS(0) option
# and a SIG(0) record, so the message codec, the OPT/option layer and the name type are namespy's
# and are shared rather than rebuilt (docs/strategy.md says why, and PORTFOLIO.md records the
# edge). Until namespy is on PyPI it resolves from the sibling checkout through the pytest
# `pythonpath` and mypy_path below; at release time those entries go away.
dependencies = ["namespy"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # tools/check_dist.py cannot assert a wheel contains what the docs promise without
  # first being able to build one, so the build dependency belongs in the dev group.
  "build",
]
# SIG(0) signing and verification (RFC 2931, RFC 9665 sec. 6.6) need ECDSA P-256, which is a
# signature primitive: the portfolio rule (PORTFOLIO.md section 9 item 15) lets `cryptography`
# supply it, and only it. The SIG record layout, the signed-data construction and the r|s and
# x|y encodings (RFC 6605 sec. 4) stay ours.
crypto = ["cryptography>=46.0.7"]

[project.urls]
Homepage = "https://github.com/b1tninja/dnssd-srp"
Repository = "https://github.com/b1tninja/dnssd-srp"
Issues = "https://github.com/b1tninja/dnssd-srp/issues"
Changelog = "https://github.com/b1tninja/dnssd-srp/blob/main/CHANGELOG.md"

[project.scripts]
dnssd-srp = "dnssd_srp.cli:main"


[tool.hatch.version]
path = "dnssd_srp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dnssd_srp"]

[tool.hatch.build.targets.sdist]
include = ["/dnssd_srp/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../namespy" resolves the shared DNS codec from the sibling checkout until it is published.
pythonpath = [".", "../namespy"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["dnssd_srp"]

[tool.coverage.report]
# The shell floor, deliberately low and deliberately ratcheted: a stub only earns
# coverage for the line that raises. Raise this in the commit that implements a
# milestone, never in a commit that only adds tests, so the number keeps meaning
# "this behaviour is exercised" rather than "this file was imported".
fail_under = 85
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501",  # line length is the formatter's job
]
# S101 is not ignored here: `python -O` strips an assert, so one in package code is a check that
# vanishes in exactly the build that ships without the test suite watching.

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a seeded generator rather than a token, and a
# test double has to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "../namespy"

# namespy is written against its own mypy settings; an error inside it is its gate to fail.
[[tool.mypy.overrides]]
module = ["namespy.*"]
follow_imports = "silent"
